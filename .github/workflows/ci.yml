name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest's V8 coverage and the Nuxt tooling run on Node; `bun run` hands the tool binaries to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Typecheck and lint read the generated .nuxt tsconfig, and the playgrounds resolve the module from dist.
      - name: Prepare and build the module
        run: |
          bun run prepare
          bun run build:lib
      - name: Format
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test with coverage
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/nuxt-penumbra/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Check the package (publint)
        run: bun run lint:package
      - name: Check the size budgets
        run: bun run size
      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
      # A cached browser still needs the system libraries, which are not part of the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit
      # Each app builds itself in its Playwright webServer command.
      - name: End-to-end tests of the playgrounds and the demo
        run: bun run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/*/test-results/
          retention-days: 7
      - name: Build docs
        run: bun run --filter docs build

  # The module declares Nuxt >=3.12, so the tarball is installed into a fresh project of each Nuxt version, built in
  # every render mode (server, `ssr: false`, `nuxt generate`) and toggled in Chromium. 3.12 is the declared floor.
  # The workspace itself only ever resolves one Nuxt version.
  nuxt-versions:
    name: Pack and browser test, Nuxt ${{ matrix.nuxt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        nuxt: ['3.12', '3', '4']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Prepare and build the module
        run: |
          bun run prepare
          bun run build:lib
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install the packed tarball, build a site with it and toggle the theme in Chromium
        env:
          NUXT_VERSION: ${{ matrix.nuxt }}
        run: bun run test:pack
